<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="420" cy="560" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F97316" stop-opacity=".45"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <g fill="#fff" opacity=".5">
    <circle cx="120" cy="90" r="2"/><circle cx="300" cy="150" r="1.6"/><circle cx="980" cy="80" r="2"/>
    <circle cx="1100" cy="170" r="1.5"/><circle cx="760" cy="110" r="1.4"/><circle cx="520" cy="60" r="1.5"/>
  </g>

  <!-- ground -->
  <rect x="0" y="660" width="1200" height="140" fill="#1a1f2e"/>
  <rect x="0" y="656" width="1200" height="6" fill="#334155"/>

  <!-- garage -->
  <path d="M160 360 L420 230 L680 360 Z" fill="#c2410c"/>
  <path d="M160 360 L420 230 L680 360" fill="none" stroke="#9a3412" stroke-width="10" stroke-linejoin="round"/>
  <rect x="190" y="360" width="460" height="300" fill="#334155"/>
  <rect x="240" y="420" width="360" height="240" fill="#0b1220"/>
  <rect x="240" y="420" width="360" height="240" fill="url(#glow)"/>
  <!-- open door slats -->
  <g fill="#475569">
    <rect x="240" y="420" width="360" height="14"/><rect x="240" y="438" width="360" height="10"/>
  </g>

  <!-- boxes inside -->
  <g stroke="#78350f" stroke-width="4">
    <rect x="270" y="560" width="110" height="100" fill="#b45309"/>
    <rect x="290" y="480" width="80" height="80" fill="#d97706"/>
    <rect x="470" y="580" width="100" height="80" fill="#b45309"/>
  </g>
  <g stroke="#fde68a" stroke-width="4" opacity=".7">
    <path d="M325 560 v100"/><path d="M330 480 v80"/><path d="M520 580 v80"/>
  </g>
  <!-- old chair -->
  <g fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round">
    <path d="M400 660 v-70 h50 v70 M400 620 h50 M450 590 v-60"/>
  </g>

  <!-- arrow out -->
  <g fill="none" stroke="#fdba74" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    <path d="M640 540 Q720 470 800 520"/>
    <path d="M770 490 L805 522 L762 538"/>
  </g>

  <!-- container -->
  <path d="M780 560 L1120 560 L1080 660 L820 660 Z" fill="#F97316"/>
  <path d="M780 560 L1120 560" stroke="#ea580c" stroke-width="12" stroke-linecap="round"/>
  <g stroke="#c2410c" stroke-width="5"><path d="M880 572 v80 M950 572 v80 M1020 572 v80"/></g>
  <!-- items sticking out of container -->
  <rect x="830" y="510" width="70" height="52" fill="#b45309" stroke="#78350f" stroke-width="4"/>
  <rect x="930" y="470" width="18" height="92" fill="#94a3b8" transform="rotate(-14 939 516)"/>
  <rect x="980" y="520" width="90" height="42" fill="#64748b" stroke="#475569" stroke-width="4"/>
  <circle cx="850" cy="672" r="14" fill="#0f172a" stroke="#475569" stroke-width="5"/>
  <circle cx="1050" cy="672" r="14" fill="#0f172a" stroke="#475569" stroke-width="5"/>
</svg>
